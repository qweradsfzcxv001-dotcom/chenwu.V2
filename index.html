<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨屋農場 | CHENWU FARM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans TC",sans-serif;
    background:
    linear-gradient(rgba(20,35,27,.55),rgba(20,35,27,.70)),
    url("bg.jpg") center/cover fixed;
    color:#fff;
    padding:30px;
}

.wrap{
    max-width:520px;
    margin:auto;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.20);
    border-radius:28px;
    padding:34px;
    box-shadow:0 20px 50px rgba(0,0,0,.30);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:auto;
    background:url("avatar.jpg") center/cover;
    border:4px solid rgba(255,255,255,.9);
}

h1{
    font-family:"Noto Serif TC",serif;
    font-size:2rem;
    text-align:center;
    margin-top:18px;
}

.en{
    text-align:center;
    color:#d9d9d9;
    letter-spacing:4px;
    margin-top:4px;
}

.slogan{
    text-align:center;
    margin:18px 0;
    color:#f4ecd5;
    line-height:1.8;
}

.hero{
    margin:24px 0;
}

.hero img{
    width:100%;
    border-radius:22px;
    object-fit:cover;
    display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:24px 0;
}

.card{
    background:rgba(255,255,255,.08);
    padding:14px;
    border-radius:16px;
    text-align:center;
}

.card i{
    font-size:24px;
    color:#d9bb73;
    margin-bottom:10px;
}

.btn{
    display:block;
    text-decoration:none;
    text-align:center;
    background:#06C755;
    color:#fff;
    padding:16px;
    border-radius:50px;
    font-weight:bold;
    margin:20px 0;
    font-size:1.05rem;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    background:#05b34c;
}

.social{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-top:20px;
}

.social a{
    color:#fff;
    font-size:26px;
    transition:.25s;
}

.social a:hover{
    transform:translateY(-4px) scale(1.1);
}

footer{
    text-align:center;
    color:#ddd;
    margin-top:28px;
    font-size:.9rem;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="avatar"></div>

    <h1>晨屋農場 🍈</h1>

    <div class="en">
        CHENWU FARM
    </div>

    <div class="slogan">
        一株一果，只為最好的一顆。<br>
        溫室栽培・日本阿露斯網紋洋香瓜
    </div>

    <div class="hero">
<img src="hero.jpg" alt="">
    </div>

    <div class="features">

        <div class="card">
            <i class="fa-solid fa-seedling"></i>
            <div>一株一果</div>
        </div>

        <div class="card">
            <i class="fa-solid fa-leaf"></i>
            <div>溫室栽培</div>
        </div>

        <div class="card">
            <i class="fa-solid fa-gift"></i>
            <div>送禮首選</div>
        </div>

    </div>

    <a class="btn"
       href="https://line.me/R/ti/p/@yde6382m"
       target="_blank">

        <i class="fa-brands fa-line"></i>
        立即加入 LINE 訂購

    </a>

    <div class="social">

        <a href="https://www.instagram.com/chenwu_farm/" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="https://www.facebook.com/people/%E6%99%A8%E5%B1%8B%E8%BE%B2%E5%A0%B4/61590330897522/" target="_blank">
            <i class="fab fa-facebook"></i>
        </a>

        <a href="https://www.youtube.com/@Ye.Huag_0711" target="_blank">
            <i class="fab fa-youtube"></i>
        </a>

        <a href="https://www.tiktok.com/@bohua1996" target="_blank">
            <i class="fab fa-tiktok"></i>
        </a>

        <a href="https://www.threads.com/@chenwu_farm" target="_blank">
            <i class="fa-brands fa-threads"></i>
        </a>

    </div>

    <footer>

        CHENWU FARM<br>
        台中市外埔區｜阿露斯網紋洋香瓜

    </footer>

</div>

</body>
</html>
